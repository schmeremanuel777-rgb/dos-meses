<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="nosotros.jpg">
<link rel="apple-touch-icon" href="nosotros.jpg">
<meta property="og:image" content="nosotros.jpg">
<title>Para Vos 💜</title>
<link rel="stylesheet" href="sobre.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="particles"></canvas>
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">
    <p class="hint" id="hint">Toca el sobre 💜</p>
    <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="letter" id="letter">
            <div class="photo-wrap">
                <img src="nosotros.jpg" alt="Nosotros">
            </div>
            <button id="showLetter">Leer Carta 💌</button>
        </div>
        <div class="flap" id="flap"></div>
        <div class="front"></div>
        <div class="seal" id="seal">💜</div>
    </div>
</div>
<script src="sobre.js"></script>
</body>
</html>
